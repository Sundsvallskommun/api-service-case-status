  /{municipalityId}/{instanceType}/cases/multisign/parties/{partyId}:
    get:
      tags:
        - Cases
      summary: Get cases waiting for multi-sign by citizen identifier
      description: Get a list of case envelopes waiting for multi-sign signing for
        the given citizen identifier
      operationId: getMultisignCasesByPartyId
      parameters:
        - name: municipalityId
          in: path
          description: Municipality ID
          required: true
          schema:
            type: string
          example: 2281
        - name: instanceType
          in: path
          description: The instanceType where case belongs
          required: true
          schema:
            $ref: "#/components/schemas/InstanceType"
          example: INTERNAL
        - name: partyId
          in: path
          description: The party ID
          required: true
          schema:
            type: string
          example: 5d68eb00-d8da-49a0-a6b5-8d395be34a5e
        - name: fromDate
          in: query
          description: Filter cases on fromDate
          required: false
          schema:
            type: string
            format: date
          example: 2024-01-01
        - name: toDate
          in: query
          description: Filter cases on toDate
          required: false
          schema:
            type: string
            format: date
          example: 2024-01-31
        - name: status
          in: query
          description: Filter by status
          required: false
          schema:
            type: string
          example: Preliminär
        - name: includeStatus
          in: query
          description: Should response include status
          required: false
          schema:
            type: boolean
          example: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
