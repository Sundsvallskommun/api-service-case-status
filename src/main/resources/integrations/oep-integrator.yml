  /{municipalityId}/{instanceType}/webmessages:
    post:
      tags:
        - Webmessages
      summary: Create webmessage
      operationId: createWebmessage
      parameters:
        - name: municipalityId
          in: path
          description: Municipality id
          required: true
          schema:
            type: string
          example: 2281
        - name: instanceType
          in: path
          description: Which instanceType a message should be sent to
          required: true
          schema:
            $ref: "#/components/schemas/InstanceType"
          example: INTERNAL
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                request:
                  $ref: "#/components/schemas/WebmessageRequest"
                attachments:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
                - request
      responses:
        "201":
          description: Successful operation
          headers:
            Location:
              style: simple
              schema:
                type: string
        "500":
          description: Internal Server error
          content:
