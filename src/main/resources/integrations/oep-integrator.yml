components:
  schemas:
    Problem:
      type: object
      properties:
        instance:
          type: string
          format: uri
        type:
          type: string
          format: uri
        title:
          type: string
        detail:
          type: string
        status:
          type: integer
          format: int32
    InstanceType:
      type: string
      description: InstanceType type. INTERNAL/EXTERNAL
      enum:
        - INTERNAL
        - EXTERNAL
      examples:
        - INTERNAL
    CaseStatusChangeRequest:
      type: object
      description: SetStatus request model
      properties:
        id:
          type: integer
          format: int32
          description: The status ID
          examples:
            - "123"
        name:
          type: string
          description: The status name
          examples:
            - Inskickat
        principal:
          $ref: "#/components/schemas/Principal"
          description: The principal
    Principal:
      type: object
      description: Principal model
      properties:
        name:
          type: string
          description: The name
          examples:
            - John Doe
        userId:
          type: string
          description: The user id
          examples:
            - joh12doe
          minLength: 1
      required:
        - userId
    ConstraintViolationProblem:
      type: object
      properties:
        type:
          type: string
          format: uri
        status:
          type: integer
          format: int32
        violations:
          type: array
          items:
            $ref: "#/components/schemas/Violation"
        title:
          type: string
        instance:
          type: string
          format: uri
        causeAsProblem:
          $ref: "#/components/schemas/ThrowableProblem"
        detail:
          type: string
    ThrowableProblem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        causeAsProblem: { }
    Violation:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    CaseStatusChangeResponse:
      type: object
      description: SetStatus response model
      properties:
        eventId:
          type: integer
          format: int32
          description: Event id
          examples:
            - "123"
    ExternalReference:
      type: object
      description: ExternalReference model
      properties:
        key:
          type: string
          description: The external reference key
          examples:
            - flowInstanceId
        value:
          type: string
          description: The external reference value
          examples:
            - "356746349"
    Sender:
      type: object
      description: "Sender model. The attributes in this object are mutually exclusive,\
        \ meaning that only one of them can be set at a time."
      properties:
        userId:
          type: string
          description: The user ID of the sender. I.e. employee ID
          examples:
            - joe01doe
        administratorId:
          type: string
          description: The user ID of the case administrator. I.e. the employee ID
            of the administrative official.
          examples:
            - joe01doe
        partyId:
          type: string
          description: The party ID of the sender.
          examples:
            - 582462d3-ae94-476f-96de-f495a927dea8
    WebmessageRequest:
      type: object
      description: Webmessage request model
      properties:
        sender:
          $ref: "#/components/schemas/Sender"
          description: The sender
        message:
          type: string
          description: The message
          examples:
            - This is a message
          minLength: 1
        externalReferences:
          type: array
          items:
            $ref: "#/components/schemas/ExternalReference"
      required:
        - message
    ConfirmDeliveryRequest:
      type: object
      description: ConfirmDelivery request model
      properties:
        caseId:
          type: string
          description: The case id in the system that delivered the case. From Open-E
            Platforms perspective this is the 'external case id
          examples:
            - caa230c6-abb4-4592-ad9a-34e263c2787d
          minLength: 1
        delivered:
          type: boolean
          description: If the case was delivered
          examples:
            - "true"
        logMessage:
          type: string
          description: Any log message
          examples:
            - The case was delivered successfully
        system:
          type: string
          description: The system that delivered the case
          examples:
            - ByggR
          minLength: 1
      required:
        - caseId
        - system
    Instance:
      type: object
      description: Instance model
      properties:
        id:
          type: string
          description: InstanceType ID
          examples:
            - 123e4567-e89b-12d3-a456-426614174000
          readOnly: true
        integrationType:
          $ref: "#/components/schemas/IntegrationType"
          description: Type of integration. SOAP/REST
          examples:
            - SOAP
        instanceType:
          $ref: "#/components/schemas/InstanceType"
          description: InstanceType type. INTERNAL/EXTERNAL
          examples:
            - INTERNAL
        baseUrl:
          type: string
          description: Base URL of the instanceType
          examples:
            - https://example.com
        username:
          type: string
          description: Username for the instanceType
          examples:
            - user123
          writeOnly: true
        password:
          type: string
          description: Password for the instanceType
          examples:
            - pass123
          writeOnly: true
        familyIds:
          type: array
          description: List with family IDs
          examples:
            - "[\"family1\", \"family2\"]"
          items:
            type: string
        connectTimeout:
          type: integer
          format: int32
          description: Connection timeout in seconds
          examples:
            - "5"
        readTimeout:
          type: integer
          format: int32
          description: Read timeout in seconds
          examples:
            - "60"
    IntegrationType:
      type: string
      description: IntegrationType model
      enum:
        - SOAP
        - REST
      examples:
        - SOAP
    Direction:
      type: string
      description: Direction model
      enum:
        - INBOUND
        - OUTBOUND
      examples:
        - INBOUND
    Webmessage:
      type: object
      description: Webmessage model
      properties:
        id:
          type: integer
          format: int32
          description: The webMessageCollector Id for the message
          examples:
            - "1"
        direction:
          $ref: "#/components/schemas/Direction"
          description: If the message is inbound or outbound. Inbound means coming
            from open-E. Outbound means sent to open-E
          examples:
            - INBOUND
        municipalityId:
          type: string
          description: The municipality id
          examples:
            - "2281"
        familyId:
          type: string
          description: What E-service the message was found in
          examples:
            - "501"
        externalCaseId:
          type: string
          description: 'The external caseID '
          examples:
            - caa230c6-abb4-4592-ad9a-34e263c2787b
        message:
          type: string
          description: 'The message '
          examples:
            - Hello World
        messageId:
          type: string
          description: The unique messageId from openE for the message
          examples:
            - "12"
        sent:
          type: string
          format: date-time
          description: 'Time and date the message was sent '
          examples:
            - 2023-02-23T17:26:23
        username:
          type: string
          description: Username for the poster
          examples:
            - te01st
        firstName:
          type: string
          description: 'Firstname of the poster '
          examples:
            - Test
        lastName:
          type: string
          description: Lastname of the poster
          examples:
            - Testsson
        email:
          type: string
          description: Email for the poster
          examples:
            - test@sundsvall.se
        userId:
          type: string
          description: The userId for the poster
          examples:
            - "123"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/WebmessageAttachment"
            description: List of attachments for the message
            examples:
              - "attachment1, attachment2"
        instance:
          type: string
          description: The instance of the message
          examples:
            - external
    WebmessageAttachment:
      type: object
      description: Webmessage attachment model
      properties:
        attachmentId:
          type: integer
          format: int32
          description: The Id for the attachment
          examples:
            - "1"
        name:
          type: string
          description: The name of the file
          examples:
            - file.txt
        extension:
          type: string
          description: The extension of the file
          examples:
            - txt
        mimeType:
          type: string
          description: The mime type of the file
          examples:
            - text/plain
    Case:
      type: object
      description: Case model
      properties:
        flowInstanceId:
          type: string
          description: The flowInstanceId (caseId)
          examples:
            - "109581"
        familyId:
          type: string
          description: The familyId
          examples:
            - "832"
        version:
          type: integer
          format: int32
          description: Version of the case
          examples:
            - "4"
        flowId:
          type: string
          description: The flowId
          examples:
            - "2411"
        title:
          type: string
          description: The title of the case
          examples:
            - Anmälan om sjukfrånvaro
        status:
          $ref: "#/components/schemas/CaseStatus"
          description: The case status
        created:
          type: string
          format: date-time
          description: The case create date
          examples:
            - 2023-11-15T11:55
        payload:
          type: string
          description: The payload of the case in xml
          examples:
            - "<Values><sickNotePercentRow2><QueryID>66909</QueryID><Name><![CDATA[Omfattning\
            \ p* sjukfrånvaro enligt läkarintyg]]></Name><Value>50%</Value></sickNotePercentRow2><sickNotePeriodRow2><QueryID>66910</QueryID><Name><![CDATA[Sjukskrivningsperioden\
            \ from tom]]></Name><Datum_fran><![CDATA[2024-12-09]]></Datum_fran><Datum_till><![CDATA[2024-12-20]]></Datum_till></sickNotePeriodRow2></Values>"
    CaseStatus:
      type: object
      description: Case status model
      properties:
        id:
          type: integer
          format: int32
          description: The status ID
          examples:
            - "123"
        name:
          type: string
          description: The status name
          examples:
            - Inskickat
        newExternalMessagesDisallowed:
          type: boolean
          description: Whether new external messages are disallowed
        addExternalMessage:
          type: boolean
          description: Whether to add external message
        addInternalMessage:
          type: boolean
          description: Whether to add internal message
        isRestrictedAdminDeletable:
          type: boolean
          description: Whether restricted admin can delete
        status:
          type: string
          description: The status
          examples:
            - ARCHIVED
    CaseEnvelope:
      type: object
      description: Case envelope model
      properties:
        flowInstanceId:
          type: string
          description: The flowInstanceId (caseId)
          examples:
            - "109581"
        created:
          type: string
          format: date-time
          description: The case create date
          examples:
            - 2023-11-15T11:55
        statusUpdated:
          type: string
          format: date-time
          description: The case status change date
          examples:
            - 2023-11-16T12:01
        displayName:
          type: string
          description: The display name for the family the case belongs to
          examples:
            - Kompiskortet
        status:
          $ref: "#/components/schemas/CaseStatus"
          description: The case status
  securitySchemes: { }
